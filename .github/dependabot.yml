# Weekly, grouped, so a quiet week costs nothing and a busy one is one PR per
# ecosystem rather than one per package. Security updates are not batched:
# Dependabot opens those as soon as an advisory lands.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
